# daidai-panel deployment for Portainer (nj106 fork).
# - bridge network mode (no dedicated project network)
# - host port 5700 -> container 5700 (nginx)
# - volume name pinned to daidai_panel_data via `name:` (no compose project prefix)
# NOTE: panel-only deployment. The standalone watchtower container already
# running in Portainer handles image updates (the label below opts this
# container in); the bundled watchtower service from upstream's compose is
# intentionally omitted to avoid running two watchtower instances.
services:
  daidai-panel:
    image: linzixuanzz/daidai-panel:latest
    container_name: daidai-panel
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "5700:5700"
    volumes:
      - daidai-panel-data:/app/Dumb-Panel
    environment:
      TZ: "Asia/Shanghai"
      CONTAINER_NAME: "daidai-panel"
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  daidai-panel-data:
    driver: local
    name: daidai_panel_data
